services:
    - type: web
      name: strollbar-backend
      runtime: node
      plan: free
      rootDir: stroll-bar-backend
      buildCommand: npm ci && npm run build
      startCommand: node dist/main.js
      healthCheckPath: /v1/health/db
      autoDeployTrigger: commit
      envVars:
          - key: NODE_ENV
            value: production
          - key: DB_MIGRATIONS_RUN
            value: 'true'
          - key: DB_HOST
            sync: false
          - key: DB_PORT
            sync: false
          - key: DB_USERNAME
            sync: false
          - key: DB_PASSWORD
            sync: false
          - key: DB_NAME
            sync: false
          - key: DB_SSL
            value: require
          - key: CORS_ORIGINS
            value: 'https://peterciprian.github.io,http://localhost:4200,http://127.0.0.1:4200'
          - key: API_PUBLIC_BASE_URL
            value: 'https://stroll-bar-n5zc.onrender.com/v1'
          - key: JWT_SECRET
            generateValue: true
          - key: JWT_ACCESS_TOKEN_TTL
            value: 1h
          - key: JWT_REFRESH_SECRET
            generateValue: true
          - key: JWT_REFRESH_TOKEN_TTL
            value: 7d
          - key: API_RATE_LIMIT
            value: '100'
          - key: DB_POOL_MAX
            value: '50'
          - key: DB_POOL_MIN
            value: '2'
          - key: DB_POOL_IDLE_TIMEOUT_MS
            value: '30000'
          - key: DB_POOL_CONNECTION_TIMEOUT_MS
            value: '10000'
          - key: DB_STATEMENT_TIMEOUT_MS
            value: '30000'
          - key: OAUTH_REQUEST_TIMEOUT_MS
            value: '10000'
          - key: OAUTH_REQUEST_RETRY_ATTEMPTS
            value: '3'
          - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
            value: '15'
          - key: AUTH_EXPOSE_RESET_TOKEN
            value: 'false'
          - key: AUDIT_RETENTION_DAYS
            value: '365'
          - key: AUDIT_RETENTION_INTERVAL_MS
            value: '86400000'
          - key: EMAIL_VERIFICATION_TOKEN_TTL_MINUTES
            value: '1440'
          - key: AUTH_EXPOSE_VERIFICATION_TOKEN
            value: 'false'
          - key: EMAIL_DELIVERY_ENABLED
            value: 'true'
          - key: EMAIL_VERIFICATION_URL
            value: 'https://peterciprian.github.io/StrollBar/#/auth/verify-email'
          - key: SMTP_HOST
            sync: false
          - key: SMTP_PORT
            value: '587'
          - key: SMTP_SECURE
            value: 'false'
          - key: SMTP_USER
            sync: false
          - key: SMTP_PASSWORD
            sync: false
          - key: SMTP_FROM
            sync: false
          - key: S3_REGION
            sync: false
          - key: S3_ENDPOINT
            sync: false
          - key: S3_BUCKET_NAME
            sync: false
          - key: S3_ACCESS_KEY_ID
            sync: false
          - key: S3_SECRET_ACCESS_KEY
            sync: false
          - key: S3_PUBLIC_BASE_URL
            sync: false
          - key: S3_FORCE_PATH_STYLE
            value: 'true'
          - key: S3_PRESIGN_EXPIRES_SECONDS
            value: '900'
          - key: S3_REQUEST_TIMEOUT_MS
            value: '30000'
          - key: S3_RETRY_ATTEMPTS
            value: '3'
          - key: MEDIA_ALLOWED_IMAGE_MIME_TYPES
            value: image/jpeg,image/png,image/webp,image/gif
          - key: MEDIA_ALLOWED_VIDEO_MIME_TYPES
            value: video/mp4,video/webm,video/quicktime
          - key: MEDIA_MAX_IMAGE_SIZE_BYTES
            value: '10485760'
          - key: MEDIA_MAX_VIDEO_SIZE_BYTES
            value: '104857600'
          - key: MEDIA_MULTIPART_THRESHOLD_BYTES
            value: '26214400'
          - key: MEDIA_MULTIPART_PART_SIZE_BYTES
            value: '10485760'
          - key: MEDIA_MULTIPART_MAX_PARTS
            value: '1000'
