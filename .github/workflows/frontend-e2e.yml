name: Frontend E2E

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

jobs:
    playwright:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright browser
              working-directory: stroll-bar-frontend
              run: npx playwright install --with-deps chromium
            - name: Run local full-stack browser tests
              working-directory: stroll-bar-frontend
              env:
                  CI: 'true'
              run: npm run test:e2e
