openapi: 3.0.3
info:
  title: StrollBar MVP API
  version: 0.1.0
  description: REST contract for the StrollBar MVP.
servers:
  - url: https://api.strollbar.local/v1

tags:
  - name: Auth
  - name: Users
  - name: Strolls
  - name: Stages
  - name: Adventures

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get public creator profile
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfile'

  /strolls:
    get:
      tags: [Strolls]
      summary: Browse published public and private stroll summaries
      description: Server filters apply before pagination/counting, with no duplicates for multiple matching stages. Existing visibility and labels behavior is preserved. Category is a page-local browser filter, not an API parameter. No accent normalization is promised.
      parameters:
        - in: query
          name: search
          description: Trimmed, case-insensitive literal substring of name, description OR any stage address. Empty text is ignored; SQL wildcard characters are literal.
          schema:
            type: string
        - in: query
          name: labels
          schema:
            type: string
          description: Existing case-insensitive prefix match against serialized labels; not a category filter.
        - in: query
          name: authorId
          schema:
            type: string
            format: uuid
        - in: query
          name: city
          description: Independent trimmed, case-insensitive literal substring restriction on any stage address, ANDed with search. No separate city field; empty text is ignored. Search and city may match different stages.
          schema:
            type: string
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [newest, most_popular, top_rated, nearest]
            default: newest
          description: Nearest falls back to newest without both user coordinates.
        - in: query
          name: userLatitude
          schema:
            type: number
            minimum: -90
            maximum: 90
        - in: query
          name: userLongitude
          schema:
            type: number
            minimum: -180
            maximum: 180
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated preview summaries with items, page, limit and total after server filtering but before pagination or local category filtering. Out-of-range pages return empty items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseStrollsResponse'
        '400':
          description: Invalid query parameter, sort enum, coordinate or pagination bounds.

    post:
      tags: [Strolls]
      summary: Create stroll
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrollRequest'
      responses:
        '201':
          description: Stroll created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stroll'
        '400':
          description: The request is invalid or an explicit publish attempt fails readiness checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrollReadinessError'

  /strolls/bulk-import:
    post:
      tags: [Strolls]
      summary: Import a stroll and its stages (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImportStrollRequest'
      responses:
        '201':
          description: Stroll and stages imported.
        '400':
          description: An explicitly published import failed readiness checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrollReadinessError'

  /strolls/{strollId}:
    get:
      tags: [Strolls]
      summary: Get stroll details with ordered stages
      parameters:
        - $ref: '#/components/parameters/StrollId'
      responses:
        '200':
          description: Stroll detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrollDetailResponse'

    patch:
      tags: [Strolls]
      summary: Update stroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StrollId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStrollRequest'
      responses:
        '200':
          description: Stroll updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stroll'
        '400':
          description: An explicit publish attempt failed readiness checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrollReadinessError'

    delete:
      tags: [Strolls]
      summary: Delete stroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StrollId'
      responses:
        '204':
          description: Stroll deleted

  /strolls/{strollId}/stages:
    get:
      tags: [Stages]
      summary: List ordered stages for a stroll
      parameters:
        - $ref: '#/components/parameters/StrollId'
      responses:
        '200':
          description: Ordered stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stage'

    post:
      tags: [Stages]
      summary: Add stage to stroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StrollId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStageRequest'
      responses:
        '201':
          description: Stage created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          description: Invalid request. A stage edit that makes a published stroll invalid is saved and returns the stroll to draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrollReadinessError'

  /strolls/{strollId}/stages/{stageId}:
    patch:
      tags: [Stages]
      summary: Update stage. Invalidating edits to published strolls save and return them to draft.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StrollId'
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStageRequest'
      responses:
        '200':
          description: Stage updated.
    delete:
      tags: [Stages]
      summary: Delete stage. Invalidating edits to published strolls save and return them to draft.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StrollId'
        - $ref: '#/components/parameters/StageId'
      responses:
        '200':
          description: Stage deleted.

  /strolls/{strollId}/stages/reorder:
    patch:
      tags: [Stages]
      summary: Reorder stroll stages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StrollId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderStagesRequest'
      responses:
        '200':
          description: Stages reordered

  /adventures/unlock:
    post:
      tags: [Adventures]
      summary: Unlock (purchase) a stroll as a personal adventure
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockStrollRequest'
      responses:
        '201':
          description: Adventure created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adventure'

  /adventures/{adventureId}/start:
    post:
      tags: [Adventures]
      summary: Start an unlocked adventure
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Adventure started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adventure'

  /adventures/{adventureId}:
    get:
      tags: [Adventures]
      summary: Get current user adventure state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Adventure detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureDetailResponse'

  /adventures/{adventureId}/navigate:
    post:
      tags: [Adventures]
      summary: Move to the next or previous stage without submitting an answer
      description: Riddles are optional; reaching the final stage allows completion through the result endpoint without solving remaining riddles.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigateAdventureRequest'
      responses:
        '200':
          description: Adventure stage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureDetailResponse'

  /adventures/{adventureId}/stages/{stageId}/answer:
    post:
      tags: [Adventures]
      summary: Submit an answer for the current riddle stage
      description: Answers for non-current stages, stages without riddles, and completed adventures are rejected. Submitting an answer is not required to navigate or finish.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitStageAnswerRequest'
      responses:
        '200':
          description: Answer evaluated and progress updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitStageAnswerResponse'
        '400':
          description: Stage is not the current riddle stage, or adventure is already completed

  /adventures/{adventureId}/result:
    get:
      tags: [Adventures]
      summary: Get adventure completion and riddle results
      description: If the user has navigated to the final stage, this request completes the adventure. Completion and its timestamp remain stable on repeated requests.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Completion metrics and counts excluding stages without riddles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureResultResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
    StrollId:
      in: path
      name: strollId
      required: true
      schema:
        type: string
        format: uuid
    StageId:
      in: path
      name: stageId
      required: true
      schema:
        type: string
        format: uuid
    AdventureId:
      in: path
      name: adventureId
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, username, email, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        profileImageUrl:
          type: string
          format: uri
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicUserProfile:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        stats:
          type: object
          properties:
            publishedStrolls:
              type: integer
            unlockCount:
              type: integer
            completionCount:
              type: integer

    Stroll:
      type: object
      required:
        - id
        - name
        - authorId
        - activeStatus
        - labels
        - description
        - publicityFlag
        - stageCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        authorId:
          type: string
          format: uuid
        activeStatus:
          type: string
          enum: [draft, published, archived]
        labels:
          type: array
          items:
            type: string
        description:
          type: string
        proposerText:
          type: string
          nullable: true
        mediaUrls:
          $ref: '#/components/schemas/MediaUrls'
        publicityFlag:
          type: string
          enum: [public, unlisted, private]
        stageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaUrls:
      type: object
      properties:
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        videoUrls:
          type: array
          items:
            type: string
            format: uri

    Stage:
      type: object
      required:
        - id
        - strollId
        - orderIndex
        - name
        - description
      properties:
        id:
          type: string
          format: uuid
        strollId:
          type: string
          format: uuid
        orderIndex:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
        hasRiddle:
          type: boolean
          description: Whether the stage has a riddle; the expected answer is never returned to players.
        notes:
          type: string
          nullable: true
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        videoUrls:
          type: array
          items:
            type: string
            format: uri
        address:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          nullable: true
          minimum: -180
          maximum: 180

    Adventure:
      type: object
      required:
        - id
        - ownerUserId
        - strollId
        - purchaseTime
        - progressStatus
        - currentStageIndex
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        strollId:
          type: string
          format: uuid
        purchaseTime:
          type: string
          format: date-time
        startDateTime:
          type: string
          format: date-time
          nullable: true
        completionDateTime:
          type: string
          format: date-time
          nullable: true
        progressStatus:
          type: string
          enum: [purchased, in_progress, completed, abandoned]
        currentStageIndex:
          type: integer
          minimum: 1

    CreateStrollRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
        proposerText:
          type: string
        labels:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        videoUrls:
          type: array
          items:
            type: string
            format: uri
        activeStatus:
          type: string
          enum: [draft, published, archived]
        publicityFlag:
          type: string
          enum: [public, unlisted, private]

    UpdateStrollRequest:
      allOf:
        - $ref: '#/components/schemas/CreateStrollRequest'

    BulkImportStrollRequest:
      type: object
      required: [stroll, stages]
      properties:
        stroll:
          $ref: '#/components/schemas/CreateStrollRequest'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/CreateStageRequest'

    UpdateStageRequest:
      type: object
      properties:
        orderIndex:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
        address:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    StrollReadinessError:
      oneOf:
        - $ref: '#/components/schemas/StrollReadinessErrorV1'
        - $ref: '#/components/schemas/StrollReadinessErrorV2'

    StrollReadinessErrorV1:
      type: object
      required: [statusCode, error, message, errors]
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Request Error
        message:
          type: string
          example: The stroll is not ready to publish.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StrollReadinessIssue'

    StrollReadinessErrorV2:
      type: object
      required: [status, error, meta]
      properties:
        status:
          type: string
          enum: [error]
        error:
          type: object
          required: [code, message, errors]
          properties:
            code:
              type: string
              example: STROLL_NOT_READY
            message:
              type: string
              example: The stroll is not ready to publish.
            errors:
              type: array
              items:
                $ref: '#/components/schemas/StrollReadinessIssue'
        meta:
          type: object
          properties:
            requestId:
              type: string
            timestamp:
              type: string
              format: date-time
            version:
              type: string
              enum: [v2]

    StrollReadinessIssue:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          example: stages.0.location
        code:
          type: string
          example: STAGE_LOCATION_REQUIRED

    BrowseStrollSummary:
      type: object
      required: [id, name, authorId, labels, category, description, length, publicityFlag, stageCount, ratingAverage, ratingCount]
      description: Safe product preview. No proposer text, stage answers or protected media; only the first cover image and no videos.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        authorId:
          type: string
          format: uuid
        labels:
          type: array
          items:
            type: string
        category:
          type: string
          enum: [ARCHITECTURE, ART, CONTEMPORARY, HISTORICAL, GASTRO, BUILDING, SIGHTSEEING, SCIENCE, LANDSCAPE, URBANISM, RELIGION, SHOPPING, ENTERTAINMENT, SPORTS]
        description:
          type: string
        mediaUrls:
          $ref: '#/components/schemas/MediaUrls'
        price:
          type: object
          nullable: true
          properties:
            amount:
              type: number
            currency:
              type: string
        length:
          type: number
        publicityFlag:
          type: string
          enum: [public, unlisted, private]
        stageCount:
          type: integer
        ratingAverage:
          type: number
        ratingCount:
          type: integer

    BrowseStrollsResponse:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BrowseStrollSummary'
        page:
          type: integer
          minimum: 1
          description: Requested one-based page; out-of-range pages return empty items.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Matching strolls after server filters, before pagination and page-local category filtering.

    StrollListResponse:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Stroll'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    StrollDetailResponse:
      type: object
      properties:
        stroll:
          $ref: '#/components/schemas/Stroll'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/Stage'

    CreateStageRequest:
      type: object
      required: [orderIndex, name, description]
      properties:
        orderIndex:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
        notes:
          type: string
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        videoUrls:
          type: array
          items:
            type: string
            format: uri
        address:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        riddleAnswer:
          type: string

    ReorderStagesRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [stageId, orderIndex]
            properties:
              stageId:
                type: string
                format: uuid
              orderIndex:
                type: integer
                minimum: 1

    UnlockStrollRequest:
      type: object
      required: [strollId]
      properties:
        strollId:
          type: string
          format: uuid

    SubmitStageAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer:
          type: string

    SubmitStageAnswerResponse:
      type: object
      required: [isCorrect, adventure, stageId]
      properties:
        isCorrect:
          type: boolean
        adventure:
          $ref: '#/components/schemas/Adventure'
        stageId:
          type: string
          format: uuid

    NavigateAdventureRequest:
      type: object
      required: [direction]
      properties:
        direction:
          type: string
          enum: [next, previous]

    AdventureDetailResponse:
      type: object
      properties:
        adventure:
          $ref: '#/components/schemas/Adventure'
        stroll:
          $ref: '#/components/schemas/Stroll'
        currentStage:
          $ref: '#/components/schemas/Stage'

    AdventureResultResponse:
      type: object
      required:
        - adventure
        - completedStageCount
        - elapsedSeconds
        - routeLengthKm
        - correctAnswerCount
        - totalStageCount
        - solvedRiddleCount
        - totalRiddleCount
        - unresolvedRiddleCount
      properties:
        adventure:
          $ref: '#/components/schemas/Adventure'
        stroll:
          $ref: '#/components/schemas/Stroll'
          nullable: true
        completedStageCount:
          type: integer
        elapsedSeconds:
          type: integer
        routeLengthKm:
          type: number
        correctAnswerCount:
          type: integer
          description: Compatibility alias for solvedRiddleCount.
        totalStageCount:
          type: integer
          description: Compatibility count of all stages in the stroll.
        solvedRiddleCount:
          type: integer
        totalRiddleCount:
          type: integer
        unresolvedRiddleCount:
          type: integer
