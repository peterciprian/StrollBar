<div class="reviews-dashboard">
	<sb-page-header icon="rate_review" [title]="'REVIEWS_DASHBOARD.TITLE' | translate" [subtitle]="'REVIEWS_DASHBOARD.SUBTITLE' | translate" />
	<sb-table
		class="reviews-dashboard__table"
		[columns]="columns()"
		[rows]="reviews()"
		[loading]="loading()"
		[error]="loadError()"
		[cardOnMobile]="true"
		[loadingText]="'REVIEWS_DASHBOARD.LOADING' | translate"
		[errorTitle]="'REVIEWS_DASHBOARD.LOAD_ERROR' | translate"
		[emptyTitle]="'REVIEWS_DASHBOARD.EMPTY' | translate"
	>
		<ng-template sbCell="stroll" let-entry>
			<sb-button variant="ghost" [label]="entry.stroll?.name ?? '—'" (clicked)="openStroll(entry)" />
		</ng-template>
		<ng-template sbCell="rating" let-entry>
			<span class="reviews-dashboard__rating"><sb-icon name="star" tone="warning" size="sm" />{{ entry.review.rating }}</span>
		</ng-template>
		<ng-template sbCell="comment" let-entry>
			<span class="reviews-dashboard__comment-cell">{{ entry.review.comment ?? '—' }}</span>
		</ng-template>
		<ng-template sbCell="date" let-entry>{{ entry.review.createdAt | date: 'mediumDate' }}</ng-template>
		<ng-template sbCell="actions" let-entry>
			<sb-icon-button
				icon="delete"
				tone="danger"
				[ariaLabel]="'REVIEWS_DASHBOARD.DELETE_TOOLTIP' | translate"
				(clicked)="deleteReview(entry)"
			/>
		</ng-template>
	</sb-table>
</div>
