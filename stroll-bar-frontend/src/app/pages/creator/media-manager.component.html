<div class="media-manager">
	@if (imageUrls.length < maxImages) {
		<app-media-upload-control
			[purpose]="purpose"
			[entityId]="entityId"
			[locked]="!entityId"
			[hintKey]="purpose === 'stage' ? 'SCREENS.ADMIN_STATION_EDITOR.UPLOAD_HINT' : 'SCREENS.ADMIN_STATION_EDITOR.COVER_IMAGE_HINT'"
			[lockedHintKey]="lockedHintKey"
			accept="image/*"
			(uploaded)="change('image', [...imageUrls, $event])"
		></app-media-upload-control>
	}
	@if (videoUrls.length < maxVideos) {
		<app-media-upload-control
			[purpose]="purpose"
			[entityId]="entityId"
			[locked]="!entityId"
			[hintKey]="purpose === 'stage' ? 'SCREENS.ADMIN_STATION_EDITOR.STAGE_VIDEO_HINT' : 'SCREENS.ADMIN_STATION_EDITOR.COVER_VIDEO_HINT'"
			[lockedHintKey]="lockedHintKey"
			accept="video/*"
			icon="video_library"
			(uploaded)="change('video', [...videoUrls, $event])"
		></app-media-upload-control>
	}
	@if (imageUrls.length || videoUrls.length) {
		<div class="media-manager__grid">
			@for (url of imageUrls; track url; let i = $index) {
				<div class="media-manager__item">
					<img [src]="url" alt="" />
					<div class="media-manager__actions">
						<sb-icon-button
							icon="arrow_back"
							[ariaLabel]="'COMMON.MOVE_BACK' | translate"
							[disabled]="i === 0"
							(clicked)="move('image', i, -1)"
						/>
						<sb-icon-button
							icon="arrow_forward"
							[ariaLabel]="'COMMON.MOVE_FORWARD' | translate"
							[disabled]="i === imageUrls.length - 1"
							(clicked)="move('image', i, 1)"
						/>
						<sb-icon-button icon="delete" tone="danger" [ariaLabel]="'COMMON.DELETE' | translate" (clicked)="remove('image', i)" />
					</div>
				</div>
			}
			@for (url of videoUrls; track url; let i = $index) {
				<div class="media-manager__item">
					<video [src]="url" controls preload="metadata"></video>
					<div class="media-manager__actions">
						<sb-icon-button
							icon="arrow_back"
							[ariaLabel]="'COMMON.MOVE_BACK' | translate"
							[disabled]="i === 0"
							(clicked)="move('video', i, -1)"
						/>
						<sb-icon-button
							icon="arrow_forward"
							[ariaLabel]="'COMMON.MOVE_FORWARD' | translate"
							[disabled]="i === videoUrls.length - 1"
							(clicked)="move('video', i, 1)"
						/>
						<sb-icon-button icon="delete" tone="danger" [ariaLabel]="'COMMON.DELETE' | translate" (clicked)="remove('video', i)" />
					</div>
				</div>
			}
		</div>
	}
</div>
