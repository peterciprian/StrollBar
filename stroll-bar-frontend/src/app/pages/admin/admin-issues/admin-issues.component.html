<div class="admin-issues">
	<sb-page-header
		icon="report_problem"
		[title]="'SCREENS.ADMIN_ISSUES.HEADER_TITLE' | translate"
		[subtitle]="'SCREENS.ADMIN_ISSUES.SUBTITLE' | translate"
	/>

	<sb-stat-grid class="admin-issues__summary" aria-live="polite" [stats]="summaryStats()" />

	<sb-table
		class="admin-issues__table"
		[columns]="columns()"
		[rows]="rows()"
		[loading]="loading()"
		[error]="loadError()"
		[cardOnMobile]="true"
		[loadingText]="'SCREENS.ADMIN_ISSUES.LOADING' | translate"
		[errorTitle]="'SCREENS.ADMIN_ISSUES.LOAD_ERROR' | translate"
		[emptyTitle]="'SCREENS.ADMIN_ISSUES.EMPTY' | translate"
	>
		<ng-template sbCell="stroll" let-entry>
			<div class="admin-issues__stroll-cell">
				<sb-button
					variant="tertiary"
					size="sm"
					[label]="entry.stroll?.name ?? '—'"
					[disabled]="!entry.stroll"
					[tooltip]="'SCREENS.ADMIN_ISSUES.OPEN_EDITOR_TOOLTIP' | translate"
					(clicked)="openStrollEditor(entry)"
				/>
				@if (entry.stroll?.activeStatus === 'suspended') {
					<sb-badge size="sm" tone="danger" [label]="'SCREENS.ADMIN_ISSUES.SUSPENDED_CHIP' | translate" />
				}
			</div>
		</ng-template>

		<ng-template sbCell="author" let-entry>
			<div class="admin-issues__author-cell">
				<strong>{{ entry.author?.username ?? '—' }}</strong>
				<span>{{ entry.author?.email }}</span>
			</div>
		</ng-template>

		<ng-template sbCell="message" let-entry>
			<p class="admin-issues__message-cell">{{ entry.report.message }}</p>
		</ng-template>

		<ng-template sbCell="reportedAt" let-entry>
			<div class="admin-issues__date">
				<strong>{{ entry.report.createdAt | date: 'mediumDate' }}</strong>
				<span>{{ entry.report.createdAt | date: 'shortTime' }}</span>
			</div>
		</ng-template>
	</sb-table>
</div>
