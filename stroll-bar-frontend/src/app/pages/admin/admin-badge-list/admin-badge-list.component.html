<div class="admin-badge-list">
	<sb-page-header
		icon="emoji_events"
		[title]="'SCREENS.ADMIN_BADGE_LIST.HEADER_TITLE' | translate"
		[subtitle]="'SCREENS.ADMIN_BADGE_LIST.SUBTITLE' | translate"
	>
		<sb-button icon="add" [label]="'SCREENS.ADMIN_BADGE_LIST.CREATE_BUTTON' | translate" (clicked)="openCreateDialog()" />
	</sb-page-header>

	<sb-table
		class="admin-badge-list__table"
		[columns]="columns()"
		[rows]="rows()"
		[loading]="loading()"
		[error]="loadError()"
		[cardOnMobile]="true"
		[loadingText]="'SCREENS.ADMIN_BADGE_LIST.LOADING' | translate"
		[errorTitle]="'SCREENS.ADMIN_BADGE_LIST.LOAD_ERROR' | translate"
		[emptyTitle]="'SCREENS.ADMIN_BADGE_LIST.EMPTY' | translate"
	>
		<ng-template sbCell="badge" let-definition>
			<div class="admin-badge-list__badge-cell">
				<sb-icon class="admin-badge-list__badge-icon" size="lg" [name]="definition.icon" />
				<div class="admin-badge-list__badge-text">
					<strong>{{ definition.title }}</strong>
					<span>{{ definition.description }}</span>
					<small>{{ definition.code }}</small>
				</div>
			</div>
		</ng-template>

		<ng-template sbCell="rules" let-definition>
			<p class="admin-badge-list__rules-cell">{{ ruleSummary(definition) }}</p>
		</ng-template>

		<ng-template sbCell="active" let-definition>
			<mat-slide-toggle [checked]="definition.active" (change)="toggleActive(definition)"></mat-slide-toggle>
		</ng-template>

		<ng-template sbCell="actions" let-definition>
			<div class="admin-badge-list__actions">
				<sb-icon-button
					icon="edit"
					tone="primary"
					[ariaLabel]="'SCREENS.ADMIN_BADGE_LIST.EDIT_TOOLTIP' | translate"
					[tooltip]="'SCREENS.ADMIN_BADGE_LIST.EDIT_TOOLTIP' | translate"
					(clicked)="openEditDialog(definition)"
				/>
				<sb-icon-button
					icon="delete"
					tone="danger"
					[ariaLabel]="'SCREENS.ADMIN_BADGE_LIST.DELETE_TOOLTIP' | translate"
					[tooltip]="'SCREENS.ADMIN_BADGE_LIST.DELETE_TOOLTIP' | translate"
					(clicked)="deleteDefinition(definition)"
				/>
			</div>
		</ng-template>
	</sb-table>
</div>
