<sb-dialog-shell
	icon="emoji_events"
	[title]="(isEdit ? 'SCREENS.ADMIN_BADGE_LIST.FORM_EDIT_TITLE' : 'SCREENS.ADMIN_BADGE_LIST.FORM_CREATE_TITLE') | translate"
>
	<div class="badge-form">
		<sb-input [label]="'SCREENS.ADMIN_BADGE_LIST.FORM_CODE' | translate" [disabled]="isEdit" [maxlength]="64" [(ngModel)]="code" />

		<sb-input [label]="'SCREENS.ADMIN_BADGE_LIST.FORM_ICON' | translate" placeholder="emoji_events" [maxlength]="64" [(ngModel)]="icon" />

		<sb-input [label]="'SCREENS.ADMIN_BADGE_LIST.FORM_TITLE_FIELD' | translate" [maxlength]="150" [(ngModel)]="title" />

		<sb-textarea [label]="'SCREENS.ADMIN_BADGE_LIST.FORM_DESCRIPTION' | translate" [rows]="2" [(ngModel)]="description" />

		<sb-checkbox [label]="'SCREENS.ADMIN_BADGE_LIST.FORM_ACTIVE' | translate" [(ngModel)]="active" />

		<div class="badge-form__rules">
			<div class="badge-form__rules-header">
				<h3>{{ 'SCREENS.ADMIN_BADGE_LIST.FORM_RULES_TITLE' | translate }}</h3>
				<sb-button variant="secondary" icon="add" [label]="'SCREENS.ADMIN_BADGE_LIST.FORM_ADD_RULE' | translate" (clicked)="addRule()" />
			</div>
			<p class="badge-form__rules-hint">{{ 'SCREENS.ADMIN_BADGE_LIST.FORM_RULES_HINT' | translate }}</p>

			@for (rule of rules(); track $index) {
				<div class="badge-form__rule-row">
					<sb-select [options]="metricOptions()" [ngModel]="rule.metric" (ngModelChange)="updateRule($index, { metric: $event })" />

					<sb-select [options]="operatorOptions()" [ngModel]="rule.operator" (ngModelChange)="updateRule($index, { operator: $event })" />

					@if (isCategoryMetric(rule.metric)) {
						<sb-select [options]="categoryOptions()" [ngModel]="rule.value" (ngModelChange)="updateRule($index, { value: $event })" />
					} @else {
						<sb-input type="number" [ngModel]="rule.value" (ngModelChange)="updateRule($index, { value: $event })" />
					}

					<sb-icon-button icon="delete" tone="danger" [ariaLabel]="'COMMON.DELETE' | translate" (clicked)="removeRule($index)" />
				</div>
			}
		</div>

		@if (formError()) {
			<sb-alert tone="danger" [message]="formError() | translate" />
		}
	</div>

	<ng-container sbDialogActions>
		<sb-button variant="tertiary" [label]="'COMMON.CANCEL' | translate" (clicked)="cancel()" />
		<sb-button [label]="'SCREENS.ADMIN_BADGE_LIST.FORM_SAVE' | translate" (clicked)="save()" />
	</ng-container>
</sb-dialog-shell>
