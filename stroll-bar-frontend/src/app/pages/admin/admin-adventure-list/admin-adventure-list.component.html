<div class="admin-adventure-list">
	<sb-page-header
		icon="explore"
		[title]="'SCREENS.ADMIN_ADVENTURE_LIST.HEADER_TITLE' | translate"
		[subtitle]="'SCREENS.ADMIN_ADVENTURE_LIST.SUBTITLE' | translate"
	/>

	<sb-stat-grid class="admin-adventure-list__summary" aria-live="polite" [stats]="summaryStats()" />

	<section class="admin-adventure-list__assign">
		<h2>{{ 'SCREENS.ADMIN_ADVENTURE_LIST.ASSIGN_TITLE' | translate }}</h2>
		<div class="admin-adventure-list__assign-form">
			<sb-select
				class="admin-adventure-list__assign-field"
				[options]="userOptions()"
				[placeholder]="'SCREENS.ADMIN_ADVENTURE_LIST.ASSIGN_USER_PLACEHOLDER' | translate"
				[ngModel]="selectedUserId()"
				(ngModelChange)="selectedUserId.set($event)"
			/>
			<sb-select
				class="admin-adventure-list__assign-field"
				[options]="strollOptions()"
				[placeholder]="'SCREENS.ADMIN_ADVENTURE_LIST.ASSIGN_STROLL_PLACEHOLDER' | translate"
				[ngModel]="selectedStrollId()"
				(ngModelChange)="selectedStrollId.set($event)"
			/>
			<sb-button
				icon="person_add"
				[label]="'SCREENS.ADMIN_ADVENTURE_LIST.ASSIGN_BUTTON' | translate"
				[loading]="assigning()"
				[disabled]="!selectedUserId() || !selectedStrollId()"
				(clicked)="assign()"
			/>
			@if (assignError()) {
				<sb-alert tone="danger" [message]="assignError() | translate" />
			}
		</div>
	</section>

	<sb-table
		class="admin-adventure-list__table"
		[columns]="columns()"
		[rows]="rows()"
		[loading]="loading()"
		[error]="loadError()"
		[cardOnMobile]="true"
		[loadingText]="'SCREENS.ADMIN_ADVENTURE_LIST.LOADING' | translate"
		[errorTitle]="'SCREENS.ADMIN_ADVENTURE_LIST.LOAD_ERROR' | translate"
		[emptyTitle]="'SCREENS.ADMIN_ADVENTURE_LIST.EMPTY' | translate"
	>
		<ng-template sbCell="owner" let-entry>
			<div class="admin-adventure-list__owner-cell">
				<strong>{{ entry.owner?.username ?? '—' }}</strong>
				<span>{{ entry.owner?.email }}</span>
			</div>
		</ng-template>

		<ng-template sbCell="stroll" let-entry>
			{{ entry.stroll?.name ?? '—' }}
		</ng-template>

		<ng-template sbCell="status" let-entry>
			<sb-badge
				role="status"
				[tone]="statusTone(entry.adventure.progressStatus)"
				[label]="'SCREENS.USER_DASHBOARD.STATUS_' + entry.adventure.progressStatus.toUpperCase() | translate"
			/>
		</ng-template>

		<ng-template sbCell="purchased" let-entry>
			<div class="admin-adventure-list__date">
				<strong>{{ entry.adventure.purchaseTime | date: 'mediumDate' }}</strong>
			</div>
		</ng-template>

		<ng-template sbCell="actions" let-entry>
			<div class="admin-adventure-list__actions">
				<sb-icon-button
					icon="person_remove"
					tone="danger"
					[ariaLabel]="'SCREENS.ADMIN_ADVENTURE_LIST.REVOKE_TOOLTIP' | translate"
					[tooltip]="'SCREENS.ADMIN_ADVENTURE_LIST.REVOKE_TOOLTIP' | translate"
					[disabled]="entry.adventure.progressStatus === 'revoked'"
					(clicked)="revoke(entry)"
				/>
			</div>
		</ng-template>
	</sb-table>
</div>
