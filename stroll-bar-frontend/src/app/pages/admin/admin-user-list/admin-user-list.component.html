<div class="admin-user-list">
	<sb-page-header
		icon="group"
		[title]="'SCREENS.ADMIN_USER_LIST.HEADER_TITLE' | translate"
		[subtitle]="'SCREENS.ADMIN_USER_LIST.SUBTITLE' | translate"
	/>

	<sb-stat-grid class="admin-user-list__summary" aria-live="polite" [stats]="summaryStats()" />

	@if (saveError()) {
		<sb-alert tone="danger" [message]="'SCREENS.ADMIN_USER_LIST.SAVE_ERROR' | translate" />
	}

	<sb-table
		class="admin-user-list__table"
		[columns]="columns()"
		[rows]="rows()"
		[loading]="loading()"
		[error]="loadError()"
		[cardOnMobile]="true"
		[loadingText]="'SCREENS.ADMIN_USER_LIST.LOADING' | translate"
		[errorTitle]="'SCREENS.ADMIN_USER_LIST.LOAD_ERROR' | translate"
		[emptyTitle]="'SCREENS.ADMIN_USER_LIST.EMPTY' | translate"
	>
		<ng-template sbCell="user" let-user>
			<div class="admin-user-list__name-cell">
				<strong>{{ user.username }}</strong>
				<small>{{ user.id }}</small>
			</div>
		</ng-template>

		<ng-template sbCell="status" let-user>
			<sb-badge
				role="status"
				[tone]="user.isActive ? 'success' : 'neutral'"
				[icon]="user.isActive ? 'check_circle' : 'block'"
				[label]="(user.isActive ? 'SCREENS.ADMIN_USER_LIST.ACTIVE' : 'SCREENS.ADMIN_USER_LIST.INACTIVE') | translate"
			/>
		</ng-template>

		<ng-template sbCell="verified" let-user>
			<sb-badge
				[tone]="user.emailVerified ? 'info' : 'neutral'"
				[icon]="user.emailVerified ? 'verified' : 'mark_email_unread'"
				[label]="(user.emailVerified ? 'SCREENS.ADMIN_USER_LIST.VERIFIED' : 'SCREENS.ADMIN_USER_LIST.UNVERIFIED') | translate"
			/>
		</ng-template>

		<ng-template sbCell="created" let-user>
			<div class="admin-user-list__date">
				<strong>{{ user.createdAt | date: 'mediumDate' }}</strong>
				<span>{{ user.createdAt | date: 'shortTime' }}</span>
			</div>
		</ng-template>

		<ng-template sbCell="role" let-user>
			<sb-select
				class="admin-user-list__role-select"
				[attr.aria-label]="'SCREENS.ADMIN_USER_LIST.ROLE_SELECT_ARIA' | translate"
				[options]="roleSelectOptions()"
				[disabled]="savingUserId() === user.id"
				[ngModel]="roleFor(user)"
				(ngModelChange)="changeRole(user, $event)"
			/>
		</ng-template>
	</sb-table>
</div>
