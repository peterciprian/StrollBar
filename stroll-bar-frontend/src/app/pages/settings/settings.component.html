<div class="settings-page">
	<aside class="settings-page__nav">
		<h2 class="settings-page__nav-title">{{ 'SETTINGS.NAV_TITLE' | translate }}</h2>
		<mat-nav-list>
			@for (section of sections; track section.id) {
				<a
					mat-list-item
					class="settings-page__nav-item"
					[routerLink]="section.id"
					routerLinkActive="settings-page__nav-item--active"
					[routerLinkActiveOptions]="{ exact: true }"
				>
					<mat-icon matListItemIcon>{{ section.icon }}</mat-icon>
					<span matListItemTitle>{{ section.labelKey | translate }}</span>
				</a>
			}
		</mat-nav-list>
	</aside>

	<section class="settings-page__content">
		<router-outlet></router-outlet>
	</section>
</div>
