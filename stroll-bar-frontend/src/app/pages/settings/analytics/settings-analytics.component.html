<sb-page-header [title]="'SETTINGS.SECTION_ANALYTICS' | translate" />

<sb-loading-state [state]="state()" [loadingText]="'SETTINGS.ANALYTICS_LOADING' | translate" [errorTitle]="'SETTINGS.ANALYTICS_ERROR' | translate">
	<div class="settings-page__analytics">
		@for (stat of analyticsStats(); track stat.labelKey) {
			<sb-card class="settings-page__stat-card" padding="md" [clickable]="!!stat.route" (activated)="openStat(stat)">
				<sb-icon tone="primary" [name]="stat.icon" />
				<span class="settings-page__stat-value">{{ stat.value }}</span>
				<span class="settings-page__muted">{{ stat.labelKey | translate }}</span>
				@if (stat.subtitle) {
					<span class="settings-page__stat-subtitle">{{ stat.subtitle }}</span>
				}
			</sb-card>
		}
	</div>
</sb-loading-state>
