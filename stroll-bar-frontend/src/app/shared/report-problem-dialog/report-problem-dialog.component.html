<sb-dialog-shell [title]="'SHARED.REPORT_PROBLEM.TITLE' | translate: { strollName: data.strollName }" icon="shield" tone="warning">
	<p class="report-problem__intro">{{ 'SHARED.REPORT_PROBLEM.INTRO' | translate }}</p>
	<sb-textarea
		class="report-problem__field"
		[(ngModel)]="message"
		[rows]="5"
		[maxlength]="maxLength"
		[showCounter]="true"
		[label]="'SHARED.REPORT_PROBLEM.LABEL' | translate"
		[placeholder]="'SHARED.REPORT_PROBLEM.PLACEHOLDER' | translate"
	/>
	<ng-container sbDialogActions>
		<sb-button variant="ghost" [label]="'SHARED.REPORT_PROBLEM.CANCEL' | translate" (clicked)="cancel()" />
		<sb-button
			variant="danger"
			icon="send"
			[label]="'SHARED.REPORT_PROBLEM.SEND' | translate"
			[disabled]="!message.trim()"
			[loading]="submitting()"
			(clicked)="send()"
		/>
	</ng-container>
</sb-dialog-shell>
