<article class="stage-card" [class.active]="active">
	<div class="stage-card__marker">
		<span class="stage-card__badge"
			>{{ index !== null ? index : '' }}
			@if (index === null) {
				<sb-icon name="place" size="sm" />
			}
		</span>
		@if (!last) {
			<span class="stage-card__line"></span>
		}
	</div>
	<div class="stage-card__body">
		<h2>{{ title }}</h2>
		@if (address) {
			<p class="stage-card__address"><sb-icon name="near_me" size="sm" />{{ address }}</p>
		}
		@if (description) {
			<p class="stage-card__description">{{ description }}</p>
		}
	</div>
</article>
