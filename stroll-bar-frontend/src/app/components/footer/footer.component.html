<footer>
	<mat-toolbar>
		<span class="copyright">© {{ year }} {{ 'FOOTER.BRAND' | translate }}</span>

		<span class="spacer"></span>

		<a
			mat-icon-button
			class="github-btn"
			href="https://github.com/peterciprian"
			target="_blank"
			rel="noopener noreferrer"
			[attr.aria-label]="'FOOTER.GITHUB_ARIA' | translate"
		>
			<mat-icon svgIcon="github" />
		</a>
	</mat-toolbar>
</footer>
