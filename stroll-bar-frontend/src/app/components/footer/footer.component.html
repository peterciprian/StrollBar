<footer>
	<div class="footer-inner">
		<div class="footer-brand">
			<span class="footer-brand__mark" aria-hidden="true"><sb-icon name="explore" size="md" /></span>
			<div>
				<strong>{{ 'FOOTER.BRAND' | translate }}</strong>
				<span>{{ 'FOOTER.TAGLINE' | translate }}</span>
			</div>
		</div>

		<div class="footer-meta">
			<span class="copyright">© {{ year }} {{ 'FOOTER.BRAND' | translate }}</span>
			<span class="footer-divider" aria-hidden="true"></span>
			<span class="developer-credit">{{ 'FOOTER.DEVELOPED_BY' | translate }}</span>
			<nav class="footer-links" [attr.aria-label]="'FOOTER.LEGAL_ARIA' | translate">
				<a routerLink="/impressum">{{ 'FOOTER.IMPRINT' | translate }}</a>
				<a routerLink="/privacy-policy">{{ 'FOOTER.PRIVACY' | translate }}</a>
				<a routerLink="/terms-of-service">{{ 'FOOTER.TERMS' | translate }}</a>
				<a href="sitemap.xml">{{ 'FOOTER.SITEMAP' | translate }}</a>
				<button type="button" class="cookie-settings-link" (click)="openCookiePreferences()">
					{{ 'FOOTER.COOKIE_SETTINGS' | translate }}
				</button>
			</nav>
			<sb-button
				class="github-btn"
				variant="secondary"
				svgIcon="github"
				href="https://github.com/peterciprian"
				target="_blank"
				[label]="'FOOTER.VIEW_GITHUB' | translate"
				[ariaLabel]="'FOOTER.GITHUB_ARIA' | translate"
			/>
		</div>
	</div>
</footer>
