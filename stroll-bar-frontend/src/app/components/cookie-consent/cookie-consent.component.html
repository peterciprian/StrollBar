@if (visible) {
	<div class="cookie-consent" role="dialog" aria-modal="true" [attr.aria-label]="'COOKIE_CONSENT.TITLE' | translate">
		<div class="cookie-consent__content">
			<div class="cookie-consent__copy">
				<span class="cookie-consent__icon" aria-hidden="true">🍪</span>
				<div>
					<h2>{{ 'COOKIE_CONSENT.TITLE' | translate }}</h2>
					<p>{{ 'COOKIE_CONSENT.DESCRIPTION' | translate }}</p>
					<p class="cookie-consent__links">
						<a routerLink="/privacy-policy">{{ 'COOKIE_CONSENT.PRIVACY_LINK' | translate }}</a>
					</p>
				</div>
			</div>

			@if (showPreferences) {
				<div class="cookie-consent__preferences">
					<sb-checkbox
						[ngModel]="true"
						[disabled]="true"
						[label]="'COOKIE_CONSENT.NECESSARY_TITLE' | translate"
						[hint]="'COOKIE_CONSENT.NECESSARY_TEXT' | translate"
					/>
					<sb-checkbox
						[(ngModel)]="preferences"
						[label]="'COOKIE_CONSENT.PREFERENCES_TITLE' | translate"
						[hint]="'COOKIE_CONSENT.PREFERENCES_TEXT' | translate"
					/>
					<sb-checkbox
						[(ngModel)]="analytics"
						[label]="'COOKIE_CONSENT.ANALYTICS_TITLE' | translate"
						[hint]="'COOKIE_CONSENT.ANALYTICS_TEXT' | translate"
					/>
				</div>
			}

			<div class="cookie-consent__actions">
				@if (showPreferences) {
					<sb-button class="cookie-consent__button" [label]="'COOKIE_CONSENT.SAVE' | translate" (clicked)="savePreferences()" />
					<sb-button
						class="cookie-consent__button"
						variant="secondary"
						[label]="'COOKIE_CONSENT.REJECT' | translate"
						(clicked)="rejectOptional()"
					/>
				} @else {
					<sb-button class="cookie-consent__button" [label]="'COOKIE_CONSENT.ACCEPT_ALL' | translate" (clicked)="acceptAll()" />
					<sb-button
						class="cookie-consent__button"
						variant="secondary"
						[label]="'COOKIE_CONSENT.CUSTOMIZE' | translate"
						(clicked)="openPreferences()"
					/>
					<sb-button
						class="cookie-consent__button"
						variant="secondary"
						[label]="'COOKIE_CONSENT.REJECT' | translate"
						(clicked)="rejectOptional()"
					/>
				}
			</div>
		</div>
	</div>
}
