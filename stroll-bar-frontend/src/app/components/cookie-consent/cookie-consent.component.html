@if (visible) {
	<div class="cookie-consent" role="dialog" aria-modal="true" [attr.aria-label]="'COOKIE_CONSENT.TITLE' | translate">
		<div class="cookie-consent__content">
			<div class="cookie-consent__copy">
				<span class="cookie-consent__icon" aria-hidden="true">🍪</span>
				<div>
					<h2>{{ 'COOKIE_CONSENT.TITLE' | translate }}</h2>
					<p>{{ 'COOKIE_CONSENT.DESCRIPTION' | translate }}</p>
					<p class="cookie-consent__links">
						<a routerLink="/privacy-policy">{{ 'COOKIE_CONSENT.PRIVACY_LINK' | translate }}</a>
					</p>
				</div>
			</div>

			@if (showPreferences) {
				<div class="cookie-consent__preferences">
					<label>
						<input type="checkbox" checked disabled />
						<span
							><strong>{{ 'COOKIE_CONSENT.NECESSARY_TITLE' | translate }}</strong
							><small>{{ 'COOKIE_CONSENT.NECESSARY_TEXT' | translate }}</small></span
						>
					</label>
					<label>
						<input type="checkbox" [(ngModel)]="preferences" />
						<span
							><strong>{{ 'COOKIE_CONSENT.PREFERENCES_TITLE' | translate }}</strong
							><small>{{ 'COOKIE_CONSENT.PREFERENCES_TEXT' | translate }}</small></span
						>
					</label>
					<label>
						<input type="checkbox" [(ngModel)]="analytics" />
						<span
							><strong>{{ 'COOKIE_CONSENT.ANALYTICS_TITLE' | translate }}</strong
							><small>{{ 'COOKIE_CONSENT.ANALYTICS_TEXT' | translate }}</small></span
						>
					</label>
				</div>
			}

			<div class="cookie-consent__actions">
				@if (showPreferences) {
					<button type="button" class="cookie-consent__button cookie-consent__button--primary" (click)="savePreferences()">
						{{ 'COOKIE_CONSENT.SAVE' | translate }}
					</button>
					<button type="button" class="cookie-consent__button" (click)="rejectOptional()">{{ 'COOKIE_CONSENT.REJECT' | translate }}</button>
				} @else {
					<button type="button" class="cookie-consent__button cookie-consent__button--primary" (click)="acceptAll()">
						{{ 'COOKIE_CONSENT.ACCEPT_ALL' | translate }}
					</button>
					<button type="button" class="cookie-consent__button" (click)="openPreferences()">
						{{ 'COOKIE_CONSENT.CUSTOMIZE' | translate }}
					</button>
					<button type="button" class="cookie-consent__button" (click)="rejectOptional()">{{ 'COOKIE_CONSENT.REJECT' | translate }}</button>
				}
			</div>
		</div>
	</div>
}
