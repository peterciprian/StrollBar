<mat-form-field class="sb-textarea__field" appearance="outline" subscriptSizing="dynamic">
	@if (label(); as text) {
		<mat-label>{{ text }}</mat-label>
	}
	<textarea
		matInput
		[rows]="rows()"
		[value]="value() ?? ''"
		[placeholder]="placeholder()"
		[required]="required()"
		[disabled]="isDisabled"
		[attr.maxlength]="maxlength()"
		(input)="onInput($event)"
		(blur)="markTouched()"
	></textarea>
	@if (!showError()) {
		@if (hint(); as text) {
			<mat-hint>{{ text }}</mat-hint>
		}
	}
	@if (showCounter() && maxlength()) {
		<mat-hint align="end">{{ charCount }} / {{ maxlength() }}</mat-hint>
	}
</mat-form-field>
@if (showError()) {
	<p class="sb-form-control__error" role="alert">{{ errorText() }}</p>
}
