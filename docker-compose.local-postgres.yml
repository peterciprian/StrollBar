services:
  postgres:
    image: postgres:16
    container_name: strollbar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: strollbar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strollbar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - strollbar_postgres_data:/var/lib/postgresql/data

volumes:
  strollbar_postgres_data:
